
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Check Java
        run: java -version

      - name: Check AOSP source
        run: |
          test -f Android.bp
          test -f AndroidManifest.xml
          test -d src
          test -d res
          echo "AOSP Contacts source verified"
