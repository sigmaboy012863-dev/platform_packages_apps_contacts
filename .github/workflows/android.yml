
name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Contacts
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Check source
        run: |
          test -f Android.bp
          test -f AndroidManifest.xml
          echo "AOSP Contacts source verified"
