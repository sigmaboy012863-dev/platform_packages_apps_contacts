
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Contacts
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Check source
        run: |
          test -f Android.bp
          test -f AndroidManifest.xml
          test -d src
          test -d res
          test -d src-bind

      - name: Prepare Soong build environment
        run: |
          echo "AOSP Contacts source detected"
          echo "Build system: Soong"
          echo "Module: Contacts"

      - name: Build APK
        run: |
          echo "A full AOSP build environment is required."
          exit 1
